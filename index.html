<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMARS - Sistem Manajemen Aset Rumah Sakit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --hospital-primary: #0f766e;
            --hospital-secondary: #14b8a6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f0fdfa;
        }

        .sidebar-item-active {
            background-color: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #fff;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
        }

        .running-text-container {
            background: linear-gradient(90deg, #0f766e, #14b8a6);
            color: white;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .running-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 40s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #14b8a6;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header / Running Text -->
    <div class="running-text-container shrink-0">
        <div class="running-text">
            <i class="fas fa-hospital-user mr-2"></i> Selamat Datang di Sistem Manajemen Aset Rumah Sakit (SIMARS) • Pastikan Data Inventaris Terupdate Secara Real-time • Prioritas Kami Adalah Keakuratan Data dan Efisiensi Manajemen Aset • <span id="current-date-text"></span>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-teal-900 text-white flex flex-col shrink-0">
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center">
                    <i class="fas fa-hospital text-teal-800 text-xl"></i>
                </div>
                <h1 class="font-bold text-xl tracking-tight">SIMARS</h1>
            </div>

            <nav class="flex-1 px-4 py-4 space-y-2 overflow-y-auto custom-scrollbar">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-th-large w-5"></i> Dashboard
                </button>
                <button onclick="switchTab('input')" id="nav-input" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-plus-circle w-5"></i> Input Aset Baru
                </button>
                <button onclick="switchTab('database')" id="nav-database" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-database w-5"></i> Database Aset
                </button>
                <button onclick="switchTab('mutasi')" id="nav-mutasi" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-exchange-alt w-5"></i> Mutasi Aset
                </button>
                <button onclick="switchTab('ruangan')" id="nav-ruangan" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-door-open w-5"></i> Manajemen Ruangan
                </button>
                <div class="pt-4 pb-2 text-[10px] uppercase tracking-wider text-teal-400 font-bold px-3">System</div>
                <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center gap-3 p-3 rounded-xl transition hover:bg-white/10">
                    <i class="fas fa-cog w-5"></i> Master Ruangan
                </button>
            </nav>

            <div class="p-4 border-t border-teal-800">
                <div class="bg-teal-800/50 p-3 rounded-2xl flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-teal-500 flex items-center justify-center font-bold text-xs">AD</div>
                    <div class="overflow-hidden">
                        <p class="text-xs font-bold truncate" id="user-info">Memuat...</p>
                        <p class="text-[10px] text-teal-400 uppercase">Administrator</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
            <header class="h-16 bg-white border-b px-8 flex items-center justify-between">
                <h2 id="current-tab-title" class="text-lg font-bold text-slate-800">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <div id="sync-status" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100 flex items-center gap-2">
                        <div class="w-2 h-2 bg-emerald-500 rounded-full"></div> CLOUD SYNC ACTIVE
                    </div>
                </div>
            </header>

            <div id="tab-content" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <!-- Modal Template -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2rem] max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-xl">Detail Aset</h3>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-content" class="p-8 overflow-y-auto"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
  apiKey: "AIzaSyAzlAn3taV7-WMDta-AQAewzDUaZzxvxAc",
  authDomain: "inventarisnonalkes.firebaseapp.com",
  projectId: "inventarisnonalkes",
  storageBucket: "inventarisnonalkes.firebasestorage.app",
  messagingSenderId: "212207980203",
  appId: "1:212207980203:web:582396a405766aa21ab1ee"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'simars-v1';

        // State Management
        let user = null;
        let assets = [];
        let mutations = [];
        let rooms = [];
        let activeTab = 'dashboard';

        // Initialize Authentication
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('user-info').innerText = `ID: ${user.uid.substring(0, 8)}`;
                setupSubscriptions();
            }
        });

        // Subscriptions
        const setupSubscriptions = () => {
            if (!user) return;
            
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'), (snap) => {
                rooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentTab();
            }, (err) => console.error(err));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'assets'), (snap) => {
                assets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentTab();
            }, (err) => console.error(err));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'mutations'), (snap) => {
                mutations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentTab();
            }, (err) => console.error(err));
        };

        // Navigation
        window.switchTab = (tab) => {
            activeTab = tab;
            document.querySelectorAll('aside nav button').forEach(btn => {
                btn.classList.remove('sidebar-item-active');
            });
            document.getElementById(`nav-${tab}`).classList.add('sidebar-item-active');
            document.getElementById('current-tab-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            renderCurrentTab();
        };

        // Render Logic
        const renderCurrentTab = () => {
            const container = document.getElementById('tab-content');
            if (!container) return;

            switch(activeTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'input': renderInputForm(container); break;
                case 'database': renderDatabase(container); break;
                case 'mutasi': renderMutasi(container); break;
                case 'ruangan': renderRuangan(container); break;
                case 'settings': renderSettings(container); break;
            }
        };

        function renderDashboard(container) {
            const stats = {
                totalAset: assets.reduce((sum, a) => sum + (parseInt(a.qty) || 0), 0),
                totalJenis: assets.length,
                totalMutasi: mutations.length,
                ruangan: rooms.length
            };

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="card-glass p-6 border-b-4 border-teal-600">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Total Unit Aset</p>
                                <h3 class="text-3xl font-black text-slate-800">${stats.totalAset}</h3>
                            </div>
                            <div class="w-10 h-10 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center"><i class="fas fa-boxes"></i></div>
                        </div>
                    </div>
                    <div class="card-glass p-6 border-b-4 border-blue-600">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Jenis Barang</p>
                                <h3 class="text-3xl font-black text-slate-800">${stats.totalJenis}</h3>
                            </div>
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-tags"></i></div>
                        </div>
                    </div>
                    <div class="card-glass p-6 border-b-4 border-amber-600">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Total Mutasi</p>
                                <h3 class="text-3xl font-black text-slate-800">${stats.totalMutasi}</h3>
                            </div>
                            <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center"><i class="fas fa-sync-alt"></i></div>
                        </div>
                    </div>
                    <div class="card-glass p-6 border-b-4 border-purple-600">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Ruangan Aktif</p>
                                <h3 class="text-3xl font-black text-slate-800">${stats.ruangan}</h3>
                            </div>
                            <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center"><i class="fas fa-door-closed"></i></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="card-glass p-8">
                        <div class="flex justify-between items-center mb-6">
                            <h4 class="font-black text-slate-800 uppercase tracking-tighter">Aset Terbaru</h4>
                            <button onclick="switchTab('database')" class="text-teal-600 text-xs font-bold">LIHAT SEMUA</button>
                        </div>
                        <div class="space-y-4">
                            ${assets.slice(-5).reverse().map(a => `
                                <div class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                    <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center border shadow-sm shrink-0">
                                        <i class="fas fa-box text-teal-600"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="font-bold text-slate-800 truncate">${a.name}</p>
                                        <p class="text-[10px] text-slate-500 uppercase">${a.room} • SN: ${a.sn || 'N/A'}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs font-black text-teal-700">${a.qty} UNIT</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card-glass p-8">
                        <div class="flex justify-between items-center mb-6">
                            <h4 class="font-black text-slate-800 uppercase tracking-tighter">Log Mutasi Terkini</h4>
                            <button onclick="switchTab('mutasi')" class="text-teal-600 text-xs font-bold">LIHAT SEMUA</button>
                        </div>
                        <div class="space-y-4">
                            ${mutations.slice(-5).reverse().map(m => `
                                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                                        <i class="fas fa-arrow-right text-xs"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-800">${m.assetName}</p>
                                        <p class="text-[10px] text-slate-500">${m.from} → ${m.to} (${m.qty} Unit)</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderInputForm(container, existingData = null) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <form id="asset-form" class="card-glass p-10 space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Nama Barang</label>
                                <input type="text" id="a-name" required value="${existingData?.name || ''}" placeholder="Contoh: USG Mindray" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Merk / Tipe</label>
                                <input type="text" id="a-brand" required value="${existingData?.brand || ''}" placeholder="Contoh: DC-30" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Serial Number / Kode</label>
                                <input type="text" id="a-sn" value="${existingData?.sn || ''}" placeholder="Kode Inventaris" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Jumlah (Unit)</label>
                                <input type="number" id="a-qty" required value="${existingData?.qty || ''}" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Tanggal Pembelian</label>
                                <input type="date" id="a-date" value="${existingData?.date || ''}" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Lokasi Ruangan</label>
                                <select id="a-room" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition appearance-none">
                                    <option value="">Pilih Ruangan</option>
                                    ${rooms.map(r => `<option value="${r.name}" ${existingData?.room === r.name ? 'selected' : ''}>${r.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Harga Satuan (Rp)</label>
                                <input type="number" id="a-price" value="${existingData?.price || ''}" placeholder="0" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Supplier / Vendor</label>
                                <input type="text" id="a-vendor" value="${existingData?.vendor || ''}" placeholder="Nama Distributor" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-100 outline-none transition">
                            </div>
                        </div>

                        <div class="space-y-4">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Dokumentasi Aset</label>
                            <div class="flex flex-col md:flex-row gap-6 items-center">
                                <div id="image-preview" class="w-48 h-48 bg-slate-100 rounded-3xl border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden shrink-0">
                                    ${existingData?.image ? `<img src="${existingData.image}" class="w-full h-full object-cover">` : '<i class="fas fa-camera text-3xl text-slate-300"></i>'}
                                </div>
                                <div class="flex-1 space-y-3">
                                    <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden">
                                    <button type="button" onclick="document.getElementById('file-input').click()" class="bg-white border border-slate-200 px-6 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition flex items-center gap-2">
                                        <i class="fas fa-upload"></i> Ambil Foto / Upload
                                    </button>
                                    <p class="text-[10px] text-slate-400">Pastikan foto jelas agar mudah diidentifikasi saat maintenance.</p>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-5 bg-teal-700 text-white rounded-[1.5rem] font-bold text-lg hover:bg-teal-800 transition-all shadow-xl shadow-teal-900/10">
                            ${existingData ? 'PERBARUI DATA ASET' : 'SIMPAN ASET BARU'}
                        </button>
                    </form>
                </div>
            `;

            let imageData = existingData?.image || '';
            const fileInput = document.getElementById('file-input');
            const preview = document.getElementById('image-preview');

            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        imageData = ev.target.result;
                        preview.innerHTML = `<img src="${imageData}" class="w-full h-full object-cover">`;
                    };
                    reader.readAsDataURL(file);
                }
            };

            document.getElementById('asset-form').onsubmit = async (e) => {
                e.preventDefault();
                if (!user) return;

                const payload = {
                    name: document.getElementById('a-name').value,
                    brand: document.getElementById('a-brand').value,
                    sn: document.getElementById('a-sn').value,
                    qty: parseInt(document.getElementById('a-qty').value),
                    date: document.getElementById('a-date').value,
                    room: document.getElementById('a-room').value,
                    price: parseInt(document.getElementById('a-price').value) || 0,
                    vendor: document.getElementById('a-vendor').value,
                    image: imageData,
                    updatedAt: serverTimestamp()
                };

                try {
                    if (existingData) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'assets', existingData.id), payload);
                    } else {
                        payload.createdAt = serverTimestamp();
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'assets'), payload);
                    }
                    switchTab('database');
                } catch (err) {
                    alert("Gagal menyimpan: " + err.message);
                }
            };
        }

        function renderDatabase(container) {
            container.innerHTML = `
                <div class="card-glass overflow-hidden">
                    <div class="p-6 border-b flex flex-col md:flex-row gap-4 justify-between items-center">
                        <div class="relative w-full md:w-96">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="db-search" placeholder="Cari nama, merk, atau SN..." class="w-full pl-12 pr-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-teal-100">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="exportToExcel()" class="px-4 py-2 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-xl font-bold text-xs flex items-center gap-2">
                                <i class="fas fa-file-excel"></i> EXCEL
                            </button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b">
                                <tr>
                                    <th class="px-6 py-4">Foto</th>
                                    <th class="px-6 py-4">Nama Barang</th>
                                    <th class="px-6 py-4">Lokasi</th>
                                    <th class="px-6 py-4">SN / Kode</th>
                                    <th class="px-6 py-4 text-center">Stok</th>
                                    <th class="px-6 py-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="db-table-body" class="divide-y text-slate-700">
                                ${assets.map(a => `
                                    <tr class="hover:bg-teal-50/30 transition">
                                        <td class="px-6 py-4">
                                            <div class="w-12 h-12 rounded-lg bg-slate-100 overflow-hidden border">
                                                ${a.image ? `<img src="${a.image}" class="w-full h-full object-cover">` : '<i class="fas fa-box m-3 text-slate-300"></i>'}
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 font-bold">
                                            ${a.name}
                                            <p class="text-[10px] text-slate-400 font-normal uppercase">${a.brand}</p>
                                        </td>
                                        <td class="px-6 py-4">
                                            <span class="px-3 py-1 bg-white border text-slate-600 rounded-full text-xs font-bold">${a.room}</span>
                                        </td>
                                        <td class="px-6 py-4 text-xs font-mono">${a.sn || '-'}</td>
                                        <td class="px-6 py-4 text-center">
                                            <span class="font-black ${a.qty < 5 ? 'text-red-600' : 'text-teal-700'}">${a.qty}</span>
                                        </td>
                                        <td class="px-6 py-4 text-right">
                                            <div class="flex justify-end gap-2">
                                                <button onclick="editAsset('${a.id}')" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition"><i class="fas fa-edit text-xs"></i></button>
                                                <button onclick="deleteAsset('${a.id}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition"><i class="fas fa-trash text-xs"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            document.getElementById('db-search').oninput = (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = assets.filter(a => 
                    a.name.toLowerCase().includes(term) || 
                    a.brand.toLowerCase().includes(term) || 
                    a.sn.toLowerCase().includes(term)
                );
                // Update table rows... (simplified)
            };
        }

        window.editAsset = (id) => {
            const data = assets.find(a => a.id === id);
            if (data) renderInputForm(document.getElementById('tab-content'), data);
        };

        window.deleteAsset = async (id) => {
            if (!user) return;
            if (confirm("Hapus data aset ini selamanya?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'assets', id));
            }
        };

        function renderMutasi(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="card-glass p-8">
                            <h4 class="font-black text-slate-800 uppercase tracking-tighter mb-6">Input Mutasi</h4>
                            <form id="mut-form" class="space-y-4">
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Aset</label>
                                    <select id="m-asset" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                                        <option value="">Pilih Aset</option>
                                        ${assets.map(a => `<option value="${a.id}">${a.name} (${a.room} - Stok: ${a.qty})</option>`).join('')}
                                    </select>
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Jumlah Unit</label>
                                    <input type="number" id="m-qty" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Tujuan</label>
                                    <select id="m-to" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none">
                                        <option value="">Pilih Ruangan</option>
                                        ${rooms.map(r => `<option value="${r.name}">${r.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Keterangan</label>
                                    <textarea id="m-note" class="w-full p-3 bg-slate-50 border rounded-xl outline-none h-20"></textarea>
                                </div>
                                <button type="submit" class="w-full py-4 bg-teal-700 text-white rounded-xl font-bold hover:bg-teal-800 transition">PROSES MUTASI</button>
                            </form>
                        </div>
                    </div>
                    <div class="lg:col-span-2">
                        <div class="card-glass overflow-hidden h-full flex flex-col">
                            <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                                <h4 class="font-black text-slate-800 uppercase tracking-tighter">Riwayat Mutasi</h4>
                            </div>
                            <div class="flex-1 overflow-y-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-white text-[10px] font-black text-slate-400 uppercase border-b sticky top-0">
                                        <tr>
                                            <th class="px-6 py-4">Aset</th>
                                            <th class="px-6 py-4">Pergerakan</th>
                                            <th class="px-6 py-4 text-center">Qty</th>
                                            <th class="px-6 py-4 text-right">Waktu</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-sm">
                                        ${mutations.map(m => `
                                            <tr class="hover:bg-slate-50">
                                                <td class="px-6 py-4 font-bold text-slate-800">${m.assetName}</td>
                                                <td class="px-6 py-4">
                                                    <div class="flex items-center gap-2">
                                                        <span class="text-[10px] px-2 py-1 bg-slate-100 rounded text-slate-500">${m.from}</span>
                                                        <i class="fas fa-long-arrow-alt-right text-teal-500"></i>
                                                        <span class="text-[10px] px-2 py-1 bg-teal-50 rounded text-teal-700 font-bold">${m.to}</span>
                                                    </div>
                                                </td>
                                                <td class="px-6 py-4 text-center font-black">${m.qty}</td>
                                                <td class="px-6 py-4 text-right text-[10px] text-slate-400">
                                                    ${m.createdAt?.toDate ? m.createdAt.toDate().toLocaleDateString('id-ID') : 'Pending'}
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('mut-form').onsubmit = async (e) => {
                e.preventDefault();
                if (!user) return;

                const aId = document.getElementById('m-asset').value;
                const mQty = parseInt(document.getElementById('m-qty').value);
                const mTo = document.getElementById('m-to').value;
                const asset = assets.find(a => a.id === aId);

                if (mQty > asset.qty) return alert("Stok tidak mencukupi!");
                if (mTo === asset.room) return alert("Tujuan tidak boleh sama dengan lokasi asal!");

                try {
                    // Update original asset
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'assets', aId), {
                        qty: asset.qty - mQty
                    });

                    // Update or create in target room
                    const existingInTarget = assets.find(a => a.name === asset.name && a.room === mTo && a.brand === asset.brand);
                    if (existingInTarget) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'assets', existingInTarget.id), {
                            qty: existingInTarget.qty + mQty
                        });
                    } else {
                        const newAsset = { ...asset };
                        delete newAsset.id;
                        newAsset.room = mTo;
                        newAsset.qty = mQty;
                        newAsset.createdAt = serverTimestamp();
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'assets'), newAsset);
                    }

                    // Log mutation
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mutations'), {
                        assetId: aId,
                        assetName: asset.name,
                        from: asset.room,
                        to: mTo,
                        qty: mQty,
                        note: document.getElementById('m-note').value,
                        createdAt: serverTimestamp()
                    });

                    alert("Mutasi berhasil!");
                    renderMutasi(container);
                } catch (err) {
                    alert("Gagal: " + err.message);
                }
            };
        }

        function renderRuangan(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="card-glass p-6 flex flex-wrap gap-4 items-center justify-between">
                        <div class="flex gap-4 items-center">
                            <label class="text-xs font-bold text-slate-500">FILTER RUANGAN:</label>
                            <select id="room-filter" class="p-3 bg-slate-50 border rounded-xl outline-none text-sm font-bold min-w-[200px]">
                                <option value="">SEMUA RUANGAN</option>
                                ${rooms.map(r => `<option value="${r.name}">${r.name.toUpperCase()}</option>`).join('')}
                            </select>
                        </div>
                        <button id="pdf-btn" class="bg-teal-700 text-white px-8 py-3 rounded-xl font-bold hover:bg-teal-800 flex items-center gap-2">
                            <i class="fas fa-file-pdf"></i> CETAK LAPORAN (F4 LANDSCAPE)
                        </button>
                    </div>

                    <div id="room-asset-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Assets grid here -->
                    </div>
                </div>
            `;

            const grid = document.getElementById('room-asset-grid');
            const filter = document.getElementById('room-filter');

            const updateGrid = () => {
                const val = filter.value;
                const filtered = val ? assets.filter(a => a.room === val) : assets;
                
                grid.innerHTML = filtered.map(a => `
                    <div onclick="showAssetDetail('${a.id}')" class="card-glass overflow-hidden group cursor-pointer hover:scale-[1.02] transition-all duration-300">
                        <div class="h-40 bg-slate-100 overflow-hidden relative">
                            ${a.image ? `<img src="${a.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><i class="fas fa-box text-4xl"></i></div>`}
                            <div class="absolute top-2 right-2 px-2 py-1 bg-teal-600 text-white text-[10px] font-black rounded-lg">${a.qty} UNIT</div>
                        </div>
                        <div class="p-4">
                            <p class="text-[10px] font-bold text-teal-600 uppercase mb-1">${a.room}</p>
                            <h5 class="font-bold text-slate-800 leading-tight mb-1 group-hover:text-teal-700 transition">${a.name}</h5>
                            <p class="text-[10px] text-slate-400 font-mono">${a.sn || 'No SN'}</p>
                        </div>
                    </div>
                `).join('');
            };

            filter.onchange = updateGrid;
            updateGrid();

            document.getElementById('pdf-btn').onclick = () => exportToPDF(filter.value);
        }

        window.showAssetDetail = (id) => {
            const a = assets.find(x => x.id === id);
            const modal = document.getElementById('modal-container');
            const body = document.getElementById('modal-content');
            
            body.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="w-full md:w-1/2 space-y-4">
                        <div class="aspect-square bg-slate-100 rounded-3xl overflow-hidden border">
                            ${a.image ? `<img src="${a.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-200"><i class="fas fa-box text-6xl"></i></div>`}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-3 bg-slate-50 rounded-2xl text-center">
                                <p class="text-[8px] font-bold text-slate-400 uppercase">Kuantitas</p>
                                <p class="font-black text-slate-800">${a.qty} Unit</p>
                            </div>
                            <div class="p-3 bg-slate-50 rounded-2xl text-center">
                                <p class="text-[8px] font-bold text-slate-400 uppercase">Harga Satuan</p>
                                <p class="font-black text-slate-800">Rp ${a.price?.toLocaleString('id-ID') || '0'}</p>
                            </div>
                        </div>
                    </div>
                    <div class="w-full md:w-1/2 space-y-6">
                        <div>
                            <p class="text-[10px] font-black text-teal-600 uppercase tracking-widest">${a.room}</p>
                            <h2 class="text-3xl font-black text-slate-800 tracking-tighter">${a.name}</h2>
                            <p class="text-slate-500 font-medium">${a.brand}</p>
                        </div>
                        <div class="space-y-3">
                            <div class="flex justify-between py-2 border-b">
                                <span class="text-xs text-slate-400">Kode Inventaris</span>
                                <span class="text-xs font-mono font-bold">${a.sn || '-'}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b">
                                <span class="text-xs text-slate-400">Tgl Perolehan</span>
                                <span class="text-xs font-bold">${a.date || '-'}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b">
                                <span class="text-xs text-slate-400">Vendor / Supplier</span>
                                <span class="text-xs font-bold">${a.vendor || '-'}</span>
                            </div>
                        </div>
                        <div class="pt-4 flex gap-2">
                            <button onclick="editAsset('${a.id}'); closeModal();" class="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">EDIT DATA</button>
                            <button onclick="closeModal()" class="px-6 py-3 border border-slate-200 rounded-xl font-bold hover:bg-slate-50 transition">TUTUP</button>
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('modal-container').style.display = 'none';
        };

        function renderSettings(container) {
            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-8">
                    <div class="card-glass p-8">
                        <h4 class="font-black text-slate-800 uppercase tracking-tighter mb-6">Manajemen Ruangan</h4>
                        <div class="flex gap-4 mb-6">
                            <input type="text" id="new-room-name" placeholder="Nama Ruangan..." class="flex-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-teal-100">
                            <button id="add-room-btn" class="bg-teal-600 text-white px-6 rounded-xl font-bold hover:bg-teal-700 transition">TAMBAH</button>
                        </div>
                        <div class="bg-slate-50 rounded-2xl overflow-hidden border">
                            <table class="w-full text-left">
                                <thead class="bg-white text-[10px] font-black text-slate-400 uppercase border-b">
                                    <tr>
                                        <th class="px-6 py-3">Nama Ruangan</th>
                                        <th class="px-6 py-3 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${rooms.map(r => `
                                        <tr class="hover:bg-white transition">
                                            <td class="px-6 py-4 font-bold text-slate-700">${r.name}</td>
                                            <td class="px-6 py-4 text-right">
                                                <button onclick="deleteRoom('${r.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fas fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('add-room-btn').onclick = async () => {
                if (!user) return;
                const name = document.getElementById('new-room-name').value;
                if (name) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'rooms'), { name });
            };
        }

        window.deleteRoom = async (id) => {
            if (!user) return;
            if (confirm("Hapus ruangan ini? Aset yang terkait mungkin akan kehilangan data lokasinya.")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', id));
            }
        };

        // EXPORT LOGIC
        window.exportToExcel = () => {
            const data = assets.map(a => ({
                'Nama Barang': a.name,
                'Merk/Tipe': a.brand,
                'Serial Number': a.sn,
                'Jumlah': a.qty,
                'Ruangan': a.room,
                'Harga Satuan': a.price,
                'Tanggal Beli': a.date,
                'Vendor': a.vendor
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventaris");
            XLSX.writeFile(wb, "SIMARS_Inventaris_Full.xlsx");
        };

        const exportToPDF = (roomName) => {
            const { jsPDF } = window.jspdf;
            
            // F4 Landscape: 330.2mm x 215.9mm
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: [215.9, 330.2]
            });

            const data = roomName ? assets.filter(a => a.room === roomName) : assets;
            
            // Header
            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.text("LAPORAN DAFTAR INVENTARIS ASET", 165.1, 15, { align: 'center' });
            
            doc.setFontSize(12);
            doc.text(`RUANGAN: ${roomName ? roomName.toUpperCase() : 'SEMUA RUANGAN'}`, 165.1, 22, { align: 'center' });
            
            doc.setLineWidth(0.5);
            doc.line(20, 25, 310, 25);

            // Table Data Preparation: No, Nama, Merk, SN/Kode, Tahun Beli, Qty
            const tableRows = data.map((a, i) => {
                let tahun = '-';
                if (a.date) {
                    const d = new Date(a.date);
                    tahun = !isNaN(d.getFullYear()) ? d.getFullYear() : '-';
                }
                return [
                    i + 1,
                    a.name,
                    a.brand,
                    a.sn || '-',
                    tahun,
                    a.qty
                ];
            });

            doc.autoTable({
                startY: 30,
                head: [['NO', 'NAMA BARANG', 'MERK / TIPE', 'KODE INV / SN', 'TAHUN BELI', 'QTY']],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [15, 118, 110], halign: 'center' },
                styles: { fontSize: 9, cellPadding: 3 },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 15 },
                    1: { cellWidth: 80 },
                    2: { cellWidth: 60 },
                    4: { halign: 'center', cellWidth: 30 },
                    5: { halign: 'center', cellWidth: 20 }
                },
                margin: { left: 20, right: 20 }
            });

            // Footer (Signatures)
            const finalY = doc.lastAutoTable.finalY + 15;
            const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");

            // Left Side
            doc.text("Pencatat Barang,", 40, finalY + 10);
            doc.text("( __________________________ )", 40, finalY + 35);
            
            // Right Side
            // Tanggal Cetak diletakkan diatas tanda tangan penanggung jawab
            doc.text(`Dicetak pada: ${today}`, 230, finalY);
            doc.text("Penanggung Jawab Ruangan,", 230, finalY + 10);
            doc.text("( __________________________ )", 230, finalY + 35);

            doc.save(`Laporan_Aset_${roomName || 'Semua'}_${Date.now()}.pdf`);
        };

        // Start App
        initAuth();
        switchTab('dashboard');

        // Utils
        const updateDateText = () => {
            const now = new Date();
            document.getElementById('current-date-text').innerText = `Waktu Server: ${now.toLocaleDateString('id-ID')} ${now.toLocaleTimeString('id-ID')}`;
        };
        setInterval(updateDateText, 1000);
        updateDateText();

    </script>
</body>
</html>
